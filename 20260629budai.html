/file/d/1seIkWCRaIXrxp2iK9mtu-d6kGoLqrp1B/view?usp=drivesdk"}, {"title": "img_104e84e4be2c.jpg", "src": "https://drive.google.com/thumbnail?id=1jw-mQm7lINLpMqMyhKtc6P6_sXHSf-qC&sz=w2048", "fallback": "https://lh3.googleusercontent.com/d/1jw-mQm7lINLpMqMyhKtc6P6_sXHSf-qC=w2048", "original": "https://drive.google.com/file/d/1fChOSjVj94vkeO_pgdt-IhmNMfYUF13N/view?usp=drivesdk", "thumbnail": "https://drive.google.com/file/d/1jw-mQm7lINLpMqMyhKtc6P6_sXHSf-qC/view?usp=drivesdk"}, {"title": "img_07aa675a6af2.jpg", "src": "https://drive.google.com/thumbnail?id=1632yZaQuCal-LjnLQc39TMrFMNRswN_1&sz=w2048", "fallback": "https://lh3.googleusercontent.com/d/1632yZaQuCal-LjnLQc39TMrFMNRswN_1=w2048", "original": "https://drive.google.com/file/d/1fcBh2DKJEb-FVJ53oqWKkqtPq9VH_fA5/view?usp=drivesdk", "thumbnail": "https://drive.google.com/file/d/1632yZaQuCal-LjnLQc39TMrFMNRswN_1/view?usp=drivesdk"}];
let current = 0;
const box = document.getElementById('lightbox'), hero = document.getElementById('hero'), cap = document.getElementById('caption');
const original = document.getElementById('original'), thumb = document.getElementById('thumb');
function show(i) { current = (i + items.length) % items.length; const it = items[current]; hero.dataset.retryCount = '0'; hero.dataset.fallbackSrc = it.fallback || ''; hero.onerror = () => retryImage(hero); hero.src = it.src; hero.alt = it.title; cap.textContent = `${current+1} / ${items.length}　${it.title}`; original.href = it.original; thumb.href = it.thumbnail; box.classList.add('open'); }
document.querySelectorAll('.card').forEach(btn => btn.addEventListener('click', () => show(Number(btn.dataset.index))));
document.getElementById('close').onclick = () => box.classList.remove('open');
document.getElementById('prev').onclick = (e) => { e.stopPropagation(); show(current-1); };
document.getElementById('next').onclick = (e) => { e.stopPropagation(); show(current+1); };
box.addEventListener('click', e => { if (e.target === box) box.classList.remove('open'); });
document.addEventListener('keydown', e => { if (!box.classList.contains('open')) return; if (e.key === 'Escape') box.classList.remove('open'); if (e.key === 'ArrowLeft') show(current-1); if (e.key === 'ArrowRight') show(current+1); });
</script>
